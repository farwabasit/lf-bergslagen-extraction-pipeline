server.port=8080
spring.application.name=cs-service

# Base URL of the Python AI-assistant app, used to relay a CS agent's chat
# replies back into the customer's chat window.
python.app.base-url=http://localhost:8000

# This is a frequently-redeployed demo app (static/index.html, app.js,
# style.css change often between runs) - without this, browsers cache those
# files aggressively and silently keep running old JS/CSS after a restart,
# which looks exactly like a broken feature (e.g. stale RBAC logic) when the
# server is actually already fixed. Force revalidation on every load.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.chain.cache=false
